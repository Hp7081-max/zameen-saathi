server {
  listen 80;
  client_max_body_size 12m;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;

  # असली क्लाइंट का IP backend तक पहुँचे (IP के हिसाब से सीमा इसी पर चलती है)।
  # इसके आगे और proxy (Cloudflare/Render) हों तो backend में TRUSTED_PROXY_HOPS बढ़ाओ।
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;   # PDF का OCR धीमा है (सर्वर का अपना बजट 150 सेकंड)
  }

  # `expires` इस्तेमाल किया है, add_header नहीं: add_header लगते ही ऊपर के सुरक्षा-हेडर इस location से गायब हो जाते हैं।
  # service worker, index.html और manifest कभी cache में न अटकें, वरना नया संस्करण पहुँचता ही नहीं (expires -1 = no-cache)
  location = /sw.js { expires -1; }
  location = /index.html { expires -1; }
  location = /manifest.webmanifest { default_type application/manifest+json; expires -1; }

  # नाम में hash वाली फ़ाइलें और फ़ॉन्ट: बहुत लंबा cache
  location /assets/ { expires 1y; }
  location /fonts/ { default_type font/woff; expires 1y; }
  location /icons/ { expires 30d; }
  location /samples/ { expires 30d; }

  location / { try_files $uri /index.html; }
}
